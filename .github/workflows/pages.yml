name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GitHub-only site
        run: |
          mkdir -p _site
          curl -fsSL -o src.html https://raw.githubusercontent.com/5614480003-ui/muscularpongpochai/main/musclularcc.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('src.html').read_text(errors='ignore')
          html = html.replace('160K+', '600K+')
          html = html.replace('160K', '600K+')
          # drop Netlify HUD / comments
          lines = [ln for ln in html.splitlines() if 'netlify' not in ln.lower()]
          html = '\n'.join(lines)
          html = html.replace(
              '<title>MUSCULARCC | Patcharapong Pongpochai — Muscle Building Coach</title>',
              '<title>MUSCULARCC | Patcharapong Pongpochai — Muscle Building Coach</title>\n<link rel="canonical" href="https://5614480003-ui.github.io/coach-Patcharapong/" />'
          )
          Path('_site/index.html').write_text(html)
          PY
          curl -fsSL -o _site/coach-photo.jpg https://raw.githubusercontent.com/5614480003-ui/muscularpongpochai/main/coach-photo.jpg
          cp _site/coach-photo.jpg _site/coach.jpg
          cp _site/coach-photo.jpg _site/coach-cover.jpg
          [ -f followers.json ] && cp followers.json _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
