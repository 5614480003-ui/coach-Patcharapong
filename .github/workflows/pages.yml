name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          parts = sorted(Path('.').glob('index.html.p*'))
          if parts:
              Path('index.html').write_text(''.join(p.read_text() for p in parts))
          PY
          mkdir -p _site
          curl -fsSL -o _site/coach.jpg https://raw.githubusercontent.com/5614480003-ui/muscularpongpochai/main/coach-photo.jpg
          cp _site/coach.jpg _site/coach-cover.jpg
          cp index.html followers.json _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
